aid: aurora
name: Aurora
description: Aurora is an EVM-compatible blockchain platform that lets developers launch fully
  customizable Virtual Chains running as smart contracts on the NEAR Protocol, pairing full Ethereum
  tooling compatibility with NEAR's low fees, sub-second block times, and fast finality. Developers
  integrate with Aurora primarily through its Ethereum-compatible JSON-RPC API (public mainnet and
  testnet endpoints), the Rainbow Bridge for moving assets between Ethereum, NEAR, and Aurora, block
  explorers, price oracles, data indexers, and the Aurora Cloud platform for spinning up dedicated
  virtual chains. Aurora ships open-source Rust engine crates and SDK, a Rust command-line interface,
  and TypeScript widgets for building intents-based cross-chain swaps.
