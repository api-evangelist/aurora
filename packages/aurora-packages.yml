notes: >-
  First-party Aurora libraries. The core engine, engine SDK, and types are published to crates.io
  from the aurora-is-near/aurora-engine repository; the client-side TypeScript packages are published
  to npm under the @aurora-is-near scope. Aurora's primary programmatic surface is the
  Ethereum-compatible JSON-RPC endpoint, so any standards-compliant Web3 client
  (ethers.js, web3.js, viem, web3.py, etc.) also works against it.
